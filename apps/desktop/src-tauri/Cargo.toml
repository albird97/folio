[package]
name = "folio-desktop"
description = "Folio for macOS and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "folio-desktop"

[lib]
name = "folio_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "folio-desktop"
path = "src/main.rs"

[[test]]
name = "print_to_file"
# AppKit prints on the main thread, and the test harness runs tests on other
# threads: this test is a plain `main`.
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
dirs = "7"
# Opt-in updates (see `updates.rs`): checked, verified and installed in Rust;
# the webview has no updater permission. Without the `zip` feature: Folio's
# updates are the installers and `.app.tar.gz` themselves (Tauri 2 artifacts),
# never zip archives, and the `zip` crate it brings has known advisories.
tauri-plugin-updater = { version = "2.14", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
semver = "1"
# Ask Claude: the user's API key in the OS credential store (platform
# backends below; Linux builds keep it in a private file), and the proxy to
# Anthropic's API over rustls with the `ring` provider and the system's
# trust store (no OpenSSL).
keyring = "3.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# Printing hands the exported PDF to PDFKit, like Preview (see `print.rs`):
# the same objc2 crates Tauri already uses, with the classes it needs.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSData",
  "NSGeometry",
  "NSObject",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSWindow",
] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "PDFDocument",
] }

# macOS routes files opened while Folio runs to the running app itself.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

# Connect to Chrome asks with a safe default button (see `connect.rs`):
# through rfd (which the dialog plugin uses) on macOS and Windows, and
# through GTK (which Tauri uses) on Linux.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
# Property tests of everything that parses input from the webview, Chrome or
# disk. No forking or timeouts: plain, fast runs.
proptest = { version = "1.12", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDictionary", "NSURL"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["PDFPage"] }
