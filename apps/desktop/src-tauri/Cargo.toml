[package]
name = "folio-desktop"
description = "Folio for macOS and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "folio-desktop"

[lib]
name = "folio_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "folio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
dirs = "7"

# macOS routes files opened while Folio runs to the running app itself.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
