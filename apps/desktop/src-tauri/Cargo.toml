[package]
name = "folio-desktop"
description = "Folio for macOS and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "folio-desktop"

[lib]
name = "folio_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "folio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
