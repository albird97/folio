name: Desktop installers

# macOS and Windows installers are built on their own platforms; Folio does not
# cross-compile them. Runs on main, version tags, pull requests and on demand.
# On other branches, add "[desktop]" to the commit message to build them.
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[desktop]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build: pnpm build:desktop:macos
            artifacts: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build: pnpm build:desktop:windows
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop:web
      # Compiles and tests the platform-specific code paths (menus, Finder open events).
      - run: cargo test --workspace --locked
      # Unsigned builds. See README "Code signing and notarization" to sign them.
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
