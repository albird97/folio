name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, unit tests, extension and UI e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install qpdf (checks the structure of exported PDFs)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the extension and the desktop UI
        run: pnpm build:extension && pnpm build:desktop:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Package the extension
        run: pnpm --filter @folio/chrome-extension package
      - uses: actions/upload-artifact@v4
        with:
          name: folio-chrome-extension
          path: apps/chrome-extension/folio-chrome-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  desktop-linux:
    name: Rust checks, Linux build and native e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK and test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend, so build it first.
      - run: pnpm build:desktop:web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm build:desktop:linux
      - run: cargo install tauri-driver --locked
      - name: Run the native end-to-end test
        run: xvfb-run -a node tests/desktop/tauri-driver.e2e.mjs
      # The Chrome extension sends documents to the real desktop host binary
      # (a debug build: only that honours FOLIO_NATIVE_HOST_NO_LAUNCH).
      - name: Build the extension and the debug desktop binary
        run: pnpm build:extension && cargo build -p folio-desktop --locked
      - run: pnpm exec playwright install --with-deps chromium
      - name: Native messaging end-to-end test (extension to desktop host)
        run: pnpm exec playwright test tests/e2e/extension/desktop.spec.ts
        env:
          FOLIO_DESKTOP_BIN: ${{ github.workspace }}/target/debug/folio-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: folio-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
